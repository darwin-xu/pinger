[tool.black]
line-length = 99
indent-width = 4
target-version = ["py311"]

[tool.ruff]
indent-width = 4
line-length = 99
target-version = "py311"

[tool.ruff.format]
indent-style = "space"
indent-width = 4
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
